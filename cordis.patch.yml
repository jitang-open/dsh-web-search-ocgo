# dsh-web-search-ocgo 的 bundle 补丁层。
#
# 做两件事：
#
# 1. 把 `web` seam 的 searchProvider 从官方 `deepseek-official` 改钉到本插件的
#    `opencode-go`。两个字段都写全：`searchProvider` 是本次改动，
#    `fetchProvider` 是重述 base bundle 里的既有值 —— 这样即使补丁层是整体替换
#    而不是深度合并，也不会把 fetch provider 弄丢。
#
# 2. 插入本插件的 loader entry。
#
# 刻意**不禁用**官方 `web-search-deepseek` entry：
#   - 官方 provider 继续留在注册表里，但不被选中（searchProvider 已钉死）；
#   - 它是一条逃生舱：搜索出问题时，在「设置 → 插件」里把 `web` 的
#     searchProvider 改回 `deepseek-official` 即可立刻回到官方链路，
#     不需要卸载本插件。
#
# 注意：`config` 段留空是有意的 —— 所有默认值都由 index.js 的 Config schema 提供
# （OPENCODE_API_KEY / Go 端点 / deepseek-v4.1-flash），这样用户在设置页改的字段
# 会直接落到 profile 的 cordis.patch.yml，不会和这里的硬编码打架。
- id: web
  config:
    searchProvider: opencode-go
    fetchProvider: http

- insert:
    - id: web-search-ocgo
      name: dsh-web-search-ocgo
